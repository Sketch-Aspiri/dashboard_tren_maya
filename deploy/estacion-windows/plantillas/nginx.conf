worker_processes  1;

error_log  {{LOGS}}/nginx-error.log warn;
pid        {{LOGS}}/nginx.pid;

events {
    worker_connections  256;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;
    server_tokens off;

    access_log  {{LOGS}}/nginx-access.log;

    # Freno a intentos de inicio de sesion por fuerza bruta (ademas del throttle de Laravel).
    limit_req_zone $binary_remote_addr zone=login:1m rate=10r/m;
    limit_req_status 429;

    # Tres procesos PHP: php-cgi en Windows atiende una peticion a la vez.
    upstream php_pool {
        server 127.0.0.1:9001;
        server 127.0.0.1:9002;
        server 127.0.0.1:9003;
    }

    server {
        listen       {{PUERTO}};
        server_name  _;
        root         {{PUBLIC}};
        index        index.php;

        charset utf-8;
        client_max_body_size 110M;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        location = /login {
            limit_req zone=login burst=10 nodelay;
            try_files $uri /index.php?$query_string;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # El asistente responde en streaming: no acumular la respuesta.
        location = /dashboard/asistente {
            fastcgi_buffering off;
            fastcgi_pass  php_pool;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            include       fastcgi_params;
            fastcgi_read_timeout 180s;
        }

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass  php_pool;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include       fastcgi_params;
            fastcgi_read_timeout 180s;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }

        # Nada oculto (.env, .git...) se sirve nunca.
        location ~ /\.(?!well-known) {
            deny all;
        }
    }
}

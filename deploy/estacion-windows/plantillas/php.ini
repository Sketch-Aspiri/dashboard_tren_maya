[PHP]
engine = On
short_open_tag = Off
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = "{{LOGS}}\php-error.log"
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Limites de subida (archivos de hasta 100 MB)
upload_max_filesize = 100M
post_max_size = 110M
memory_limit = 512M
max_execution_time = 120
max_input_time = 120
file_uploads = On

date.timezone = "America/Cancun"
default_charset = "UTF-8"
cgi.fix_pathinfo = 0
cgi.force_redirect = 0
fastcgi.impersonate = 1

extension_dir = "{{PHP_DIR}}\ext"
sys_temp_dir = "{{TEMP}}"
upload_tmp_dir = "{{TEMP}}"

extension=curl
extension=fileinfo
extension=gd
extension=intl
extension=mbstring
extension=exif
extension=mysqli
extension=openssl
extension=pdo_mysql
extension=sodium
extension=zip

[opcache]
zend_extension=opcache
opcache.enable = 1
opcache.memory_consumption = 128
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60

[curl]
curl.cainfo = "{{PHP_DIR}}\cacert.pem"

[openssl]
openssl.cafile = "{{PHP_DIR}}\cacert.pem"

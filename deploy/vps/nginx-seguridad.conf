# Fragmento para el vhost del sitio en CloudPanel (Sites > sitio > Vhost),
# DENTRO del bloque `server { ... }` del puerto 443. Cualquier cambio de Nginx
# debe revisarlo `security-auditor` antes de aplicarse.

# Archivos de hasta 100 MB (ver también PHP-FPM: upload_max_filesize=100M, post_max_size=110M).
client_max_body_size 110M;

# Cabeceras de seguridad. CSP se agrega cuando se cierre la política de assets.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Nada de archivos ocultos ni de configuración (salvo .well-known para Let's Encrypt).
location ~ /\.(?!well-known) { deny all; }
location ~* ^/(composer\.(json|lock)|package(-lock)?\.json|artisan|\.env.*)$ { deny all; }

# El asistente responde en streaming: no acumular la respuesta.
location = /dashboard/asistente {
    proxy_buffering off;
    fastcgi_buffering off;
    try_files $uri /index.php?$query_string;
}

; Worker de la cola del Dashboard. Copiar a /etc/supervisor/conf.d/dashboard-worker.conf
; (como root) y reemplazar <SITIO_USER> y <RUTA_SITIO>. Luego:
;     supervisorctl reread && supervisorctl update && supervisorctl status
;
; numprocs=1 a propósito: el VPS tiene 2 vCPU y las cargas de Excel grandes no
; deben procesarse en paralelo.
;
; REQUERIDO para "Vincular desde la nube": el cron (cron.txt) encola SincronizarOrigenJob en la
; cola `nube` cada SECCIONES_SYNC_MINUTOS y este worker lo ejecuta (--queue=nube,default).
; El job reintenta 3 veces con espera (60 s, 5 min) solo ante 429/5xx de la nube.
;
; --timeout=900 cubre SincronizarOrigenJob (900 s) y config/queue.php deja
; retry_after=960. retry_after SIEMPRE debe ser mayor que --timeout; si no, el
; mismo job se ejecuta dos veces.
[program:dashboard-worker]
process_name=%(program_name)s_%(process_num)02d
command=php <RUTA_SITIO>/artisan queue:work database --queue=nube,default --sleep=3 --tries=3 --timeout=900 --max-time=3600 --memory=900
directory=<RUTA_SITIO>
user=<SITIO_USER>
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=910
redirect_stderr=true
stdout_logfile=<RUTA_SITIO>/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

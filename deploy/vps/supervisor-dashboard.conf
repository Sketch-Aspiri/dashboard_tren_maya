; Worker de la cola del Dashboard. Copiar a /etc/supervisor/conf.d/dashboard-worker.conf
; (como root) y reemplazar <SITIO_USER> y <RUTA_SITIO>. Luego:
;     supervisorctl reread && supervisorctl update && supervisorctl status
;
; numprocs=1 a propósito: el VPS tiene 2 vCPU y las cargas de Excel grandes no
; deben procesarse en paralelo.
;
; IMPORTANTE (fase F1 de docs/plan-sincronizacion-nube.md): cuando existan los
; jobs de sincronización, cambiar --timeout a 900 y subir retry_after de la
; conexión de cola a 960. retry_after SIEMPRE debe ser mayor que --timeout; si
; no, el mismo job se ejecuta dos veces.
[program:dashboard-worker]
process_name=%(program_name)s_%(process_num)02d
command=php <RUTA_SITIO>/artisan queue:work database --queue=nube,default --sleep=3 --tries=3 --timeout=80 --max-time=3600 --memory=900
directory=<RUTA_SITIO>
user=<SITIO_USER>
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=90
redirect_stderr=true
stdout_logfile=<RUTA_SITIO>/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
